services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: quackback-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: quackback

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql:ro

    command: >-
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=quackback
      -c max_connections=200

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d quackback
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ==========================================================================
  # MinIO desativado
  # ==========================================================================
  #
  # A produção utiliza Cloudflare R2, portanto MinIO e minio-init não devem
  # iniciar. Os serviços foram mantidos comentados para possível uso local.
  #
  # Antes de reativar, substitua os valores CHANGE_ME por referências seguras
  # de variáveis de ambiente.
  #
  # minio:
  #   image: minio/minio:latest
  #   container_name: quackback-minio
  #   restart: unless-stopped
  #
  #   environment:
  #     MINIO_ROOT_USER: "CHANGE_ME_USER"
  #     MINIO_ROOT_PASSWORD: "CHANGE_ME_PASSWORD"
  #
  #   expose:
  #     - "9000"
  #     - "9001"
  #
  #   volumes:
  #     - minio_data:/data
  #
  #   command: server /data --console-address ":9001"
  #
  #   healthcheck:
  #     test:
  #       - CMD
  #       - mc
  #       - ready
  #       - local
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20
  #     start_period: 10s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    container_name: quackback-dragonfly
    restart: unless-stopped

    environment:
      DRAGONFLY_PASSWORD: "${DRAGONFLY_PASSWORD}"

    command: >-
      dragonfly
      --cluster_mode=emulated
      --lock_on_hashtags
      --requirepass ${DRAGONFLY_PASSWORD}

    expose:
      - "6379"

    volumes:
      - dragonfly_data:/data

    ulimits:
      memlock: -1

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$DRAGONFLY_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Mailpit fica desativado por padrão em produção.
  # Quando o Microsoft 365 estiver configurado, ele continuará desnecessário.
  mailpit:
    profiles:
      - mailpit
    image: axllent/mailpit:latest
    container_name: quackback-mailpit
    restart: unless-stopped

    expose:
      - "8025"
      - "1025"

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8025/api/v1/info
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==========================================================================
  # Inicializador do MinIO desativado
  # ==========================================================================
  #
  # minio-init:
  #   image: minio/mc:latest
  #   container_name: quackback-minio-init
  #
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #
  #   environment:
  #     MINIO_ROOT_USER: "CHANGE_ME_USER"
  #     MINIO_ROOT_PASSWORD: "CHANGE_ME_PASSWORD"
  #     MINIO_BUCKET_NAME: quackback
  #
  #   entrypoint: >
  #     /bin/sh -c "
  #     mc alias set local
  #     http://minio:9000
  #     \"$$MINIO_ROOT_USER\"
  #     \"$$MINIO_ROOT_PASSWORD\";
  #     mc mb \"local/$$MINIO_BUCKET_NAME\" --ignore-existing;
  #     exit 0;
  #     "
  #
  #   restart: "no"

volumes:
  postgres_data:
  dragonfly_data:

  # Desativado juntamente com o MinIO.
  # minio_data:

# ============================================================================
# DEVELOPMENT infrastructure only — Postgres, MinIO, Dragonfly, Mailpit.
# Started by `bun run setup` / `bun run dev`; the app itself runs on the host
# via `bun run dev`, so there is NO app service here.
#
# This file uses insecure defaults (postgres/password, minioadmin), publishes
# datastore ports on localhost, and makes the upload bucket world-readable —
# all fine for local development, NOT safe on an internet-facing host.
#
# To self-host Quackback, use docker-compose.prod.yml instead (app included,
# hardened defaults). See the self-hosting docs.
# ============================================================================

services:
  quackback-db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: quackback-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: quackback

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    command: >-
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=quackback
      -c max_connections=200

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d quackback
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
      
    cpus: 1.5
    mem_limit: 2g
    mem_reservation: 512m
    mem_swappiness: 0
    memswap_limit: 2g

  # ==========================================================================
  # MinIO desativado
  # ==========================================================================
  #
  # A produção utiliza Cloudflare R2, portanto MinIO e minio-init não iniciam.
  #
  # minio:
  #   image: minio/minio:latest
  #   container_name: quackback-minio
  #   restart: unless-stopped
  #
  #   environment:
  #     MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
  #     MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
  #
  #   expose:
  #     - "9000"
  #     - "9001"
  #
  #   volumes:
  #     - minio_data:/data
  #
  #   command: server /data --console-address ":9001"

  quackback-dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    restart: unless-stopped

    environment:
      DRAGONFLY_PASSWORD: "${DRAGONFLY_PASSWORD}"

    command:
      - /bin/sh
      - -ec
      - |
        test -n "$$DRAGONFLY_PASSWORD"
        exec dragonfly \
          --cluster_mode=emulated \
          --lock_on_hashtags \
          --requirepass "$$DRAGONFLY_PASSWORD"

    expose:
      - "6379"

    volumes:
      - dragonfly_data:/data

    ulimits:
      memlock: -1

    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$DRAGONFLY_PASSWORD" redis-cli ping | grep -q "^PONG$"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    cpus: 1
    mem_limit: 1g
    mem_reservation: 256m
    mem_swappiness: 0
    memswap_limit: 1g
  # ==========================================================================
  # Inicializador do MinIO desativado
  # ==========================================================================
  #
  # minio-init:
  #   image: minio/mc:latest
  #   container_name: quackback-minio-init
  #
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #
  #   environment:
  #     MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
  #     MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
  #     MINIO_BUCKET_NAME: quackback
  #
  #   entrypoint: >
  #     /bin/sh -c "
  #     mc alias set local
  #     http://minio:9000
  #     \"$$MINIO_ROOT_USER\"
  #     \"$$MINIO_ROOT_PASSWORD\";
  #     mc mb \"local/$$MINIO_BUCKET_NAME\" --ignore-existing;
  #     exit 0;
  #     "
  #
  #   restart: "no"

volumes:
  postgres_data:
  dragonfly_data:

  # minio_data:
